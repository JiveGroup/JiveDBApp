# pg_hba cho service postgres-tls — BẮT BUỘC mã hoá (chặn plaintext),
# nhưng client cert vẫn TUỲ CHỌN (không có clientcert=...).
#
# Khác biệt với postgres-mtls: ở đây KHÔNG yêu cầu client cert, nên app vào được
# chỉ với mật khẩu — miễn là kết nối có TLS. Kết nối sslmode=disable bị từ chối.
#
# TYPE       DATABASE  USER  ADDRESS      METHOD
local        all       all                trust            # init/seed qua unix socket
hostssl      all       all   0.0.0.0/0    scram-sha-256    # IPv4: chỉ chấp nhận khi có TLS
hostssl      all       all   ::0/0        scram-sha-256    # IPv6: như trên
hostnossl    all       all   0.0.0.0/0    reject            # cấm hẳn kết nối không mã hoá
hostnossl    all       all   ::0/0        reject
