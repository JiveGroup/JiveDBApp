# pg_hba cho service postgres-mtls — BẮT BUỘC client certificate (mTLS).
# Khác postgres-tls (dùng pg_hba mặc định, client cert tuỳ chọn).
#
# clientcert=verify-full: client phải gửi cert do CA tin cậy (ssl_ca_file) ký
# VÀ CN trong cert phải khớp tên user đăng nhập (cert CN=jdb ↔ user jdb).
# Thiếu cert hợp lệ → server từ chối ngay, dù mật khẩu đúng.
#
# TYPE       DATABASE  USER  ADDRESS      METHOD
local        all       all                trust                                    # init/seed qua unix socket
hostssl      all       all   0.0.0.0/0    scram-sha-256  clientcert=verify-full    # IPv4: TLS + client cert + mật khẩu
hostssl      all       all   ::0/0        scram-sha-256  clientcert=verify-full    # IPv6: như trên
hostnossl    all       all   0.0.0.0/0    reject                                   # cấm hẳn kết nối không TLS
